name: Update pre-commit hookson:  schedule:    - cron: '0 0 * * 5'  workflow_dispatch:permissions:  contents: write  pull-requests: write  actions: write  checks: write  repository-projects: writejobs:  update-pre-commit:    runs-on: ubuntu-latest    steps:      - name: Checkout repository        uses: actions/checkout@v5      - name: Update pre-commit hooks        uses: ./.github/actions/update-precommit        with:          token: ${{ secrets.GITHUB_TOKEN }}