name: GCC/Clang Build & Test

on:
  workflow_call:

jobs:
  gcc-build:
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/learning-process/ppc-ubuntu:1.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        os: ["ubuntu-24.04", "ubuntu-24.04-arm"]
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-gcc
          create-symlink: true
          max-size: 1G

      - name: CMake configure
        run: >
          cmake -S . -B build -G Ninja
          -D CMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_INSTALL_PREFIX=install
        env:
          CC: gcc-14
          CXX: g++-14

      - name: Archive revert list
        uses: actions/upload-artifact@v4
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.build_type == 'Release' }}
        with:
          name: revert-list
          path: build/revert-list.txt

      - name: Build project
        run: >
          cmake --build build --parallel -- --quiet
        env:
          CC: gcc-14
          CXX: g++-14

      - name: Install project
        run: >
          cmake --build build --target install -- --quiet

      - name: Archive installed package
        uses: ./.github/actions/archive-install
        with:
          path: install
          name: ${{ matrix.build_type == 'Debug' &&
            format('ubuntu-gcc-debug-install-{0}', matrix.os) ||
            format('ubuntu-gcc-install-{0}', matrix.os) }}

      - name: Show ccache stats
        run: ccache --show-stats

  gcc-test:
    needs: [gcc-build]
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/learning-process/ppc-ubuntu:1.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        os: ["ubuntu-24.04", "ubuntu-24.04-arm"]
    steps:
      - uses: actions/checkout@v5

      - name: Download installed package
        uses: actions/download-artifact@v5
        with:
          name: ubuntu-gcc-install-${{ matrix.os }}

      - name: Extract installed package
        run: >
          mkdir -p install
          && tar -xzvf ubuntu-gcc-install-${{ matrix.os }}.tar.gz -C install

      - name: Run func tests (MPI)
        run: >
          scripts/run_tests.py --running-type="processes"
          --counts 1 2 3 4
          --additional-mpi-args="--oversubscribe"
        env:
          PPC_NUM_THREADS: 1
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1

      - name: Run func tests (threads)
        run: >
          scripts/run_tests.py --running-type="threads"
          --counts 1 2 3 4
        env:
          PPC_NUM_PROC: 1

  gcc-test-extended:
    needs: [gcc-test]
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/learning-process/ppc-ubuntu:1.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        os: ["ubuntu-24.04", "ubuntu-24.04-arm"]
    steps:
      - uses: actions/checkout@v5

      - name: Download installed package
        uses: actions/download-artifact@v5
        with:
          name: ubuntu-gcc-install-${{ matrix.os }}

      - name: Extract installed package
        run: >
          mkdir -p install
          && tar -xzvf ubuntu-gcc-install-${{ matrix.os }}.tar.gz -C install

      - name: Run func tests (threads extended)
        run: >
          scripts/run_tests.py --running-type="threads"
          --counts 5 7 11 13
        env:
          PPC_NUM_PROC: 1

  clang-build:
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/learning-process/ppc-ubuntu:1.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        os: ["ubuntu-24.04", "ubuntu-24.04-arm"]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-clang
          create-symlink: true
          max-size: 1G

      - name: CMake configure
        run: >
          cmake -S . -B build -G Ninja
          -D CMAKE_BUILD_TYPE=RELEASE
          -DCMAKE_INSTALL_PREFIX=install
        env:
          CC: clang-21
          CXX: clang++-21

      - name: Build project
        run: >
          cmake --build build --parallel -- --quiet
        env:
          CC: clang-21
          CXX: clang++-21

      - name: Install project
        run: >
          cmake --build build --target install -- --quiet

      - name: Archive installed package
        uses: ./.github/actions/archive-install
        with:
          path: install
          name: ubuntu-clang-install-${{ matrix.os }}

      - name: Show ccache stats
        run: ccache --show-stats

  clang-test:
    needs: [clang-build]
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/learning-process/ppc-ubuntu:1.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        os: ["ubuntu-24.04", "ubuntu-24.04-arm"]
    steps:
      - uses: actions/checkout@v5

      - name: Download installed package
        uses: actions/download-artifact@v5
        with:
          name: ubuntu-clang-install-${{ matrix.os }}

      - name: Extract installed package
        run: >
          mkdir -p install
          && tar -xzvf ubuntu-clang-install-${{ matrix.os }}.tar.gz -C install

      - name: Run func tests (MPI)
        run: >
          scripts/run_tests.py --running-type="processes"
          --counts 1 2 3 4
          --additional-mpi-args="--oversubscribe"
        env:
          PPC_NUM_THREADS: 1
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1

      - name: Run tests (threads)
        run: >
          scripts/run_tests.py --running-type="threads"
          --counts 1 2 3 4
        env:
          PPC_NUM_PROC: 1

  clang-test-extended:
    needs: [clang-test]
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/learning-process/ppc-ubuntu:1.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        os: ["ubuntu-24.04", "ubuntu-24.04-arm"]
    steps:
      - uses: actions/checkout@v5

      - name: Download installed package
        uses: actions/download-artifact@v5
        with:
          name: ubuntu-clang-install-${{ matrix.os }}

      - name: Extract installed package
        run: >
          mkdir -p install
          && tar -xzvf ubuntu-clang-install-${{ matrix.os }}.tar.gz -C install

      - name: Run tests (threads extended)
        run: >
          scripts/run_tests.py --running-type="threads"
          --counts 5 7 11 13
        env:
          PPC_NUM_PROC: 1
