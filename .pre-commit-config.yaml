repos:
  # ------------------------------
  # C/C++: clang-tidy
  # ------------------------------
  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: "C:/Progra~1/LLVM/bin/clang-tidy.exe"
        language: system
        args:
          - "-p=build"
          - "--fix"
          - "--format-style=file"
          - "--warnings-as-errors=*"
        files: \.(c|cpp|cc|cxx|h|hpp|hxx)$

      - id: clang-format
        name: clang-format
        entry: "C:/Progra~1/LLVM/bin/clang-format.exe"
        language: system
        args:
          - "-i"
          - "--style=file"
        files: \.(c|cpp|cc|cxx|h|hpp|hxx)$

  # ------------------------------
  # Python: ruff
  # ------------------------------
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.0.288
    hooks:
      - id: ruff
        args:
          - "--fix"
        files: \.py$

  # ------------------------------
  # Python: flake8
  # ------------------------------
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        files: \.py$

  # ------------------------------
  # YAML: yamllint
  # ------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        files: \.(yaml|yml)$
